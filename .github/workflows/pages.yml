name: Deploy to GitHub Pages

# Publishes the site by force-pushing the repo tree to the gh-pages branch.
# On a public repo, creating gh-pages auto-enables Pages (branch source),
# so this needs no admin API access — unlike actions/deploy-pages, whose
# site-creation call is not permitted for the workflow token here.
on:
  push:
    branches: [claude/panel-zero-gdd-5m3cp3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f origin gh-pages
